apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: production-ingestor-api
  labels:
    app.kubernetes.io/name: production-ingestor
    app.kubernetes.io/instance: production-ingestor
    app.kubernetes.io/component: api
rules:
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: production-ingestor-api
  labels:
    app.kubernetes.io/name: production-ingestor
    app.kubernetes.io/instance: production-ingestor
    app.kubernetes.io/component: api
subjects:
  - kind: ServiceAccount
    name: production-ingestor-api
    namespace: cat-dev
roleRef:
  kind: Role
  name: production-ingestor-api
  apiGroup: rbac.authorization.k8s.io
