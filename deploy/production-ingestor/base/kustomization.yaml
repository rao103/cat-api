apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cat-dev

labels:
  - pairs:
      app.kubernetes.io/part-of: cat
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: true

resources:
  - configmap.yaml
  - serviceaccount-api.yaml
  - rbac.yaml
  - cronjob-worker.yaml
  - deployment-api.yaml
  - service-api.yaml

configMapGenerator:
  - name: production-ingestor-rds-ca
    files:
      - global-bundle.pem=certs/global-bundle.pem
