apiVersion: apps/v1
kind: Deployment
metadata:
  name: production-ingestor-api
  labels:
    app.kubernetes.io/name: production-ingestor
    app.kubernetes.io/instance: production-ingestor
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: production-ingestor
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: production-ingestor
        app.kubernetes.io/instance: production-ingestor
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: production-ingestor-api
      nodeSelector:
        kubernetes.io/os: linux
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        fsGroup: 10000
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: orsted-artifactory-pull-secret
      containers:
        - name: production-ingestor-api
          image: orsted.jfrog.io/dndownins-container-nonprod/dnd-cat/production-ingestor-api:0.1.0
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: production-ingestor-config
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /v1/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /v1/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
