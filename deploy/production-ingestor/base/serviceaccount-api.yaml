apiVersion: v1
kind: ServiceAccount
metadata:
  name: production-ingestor-api
  labels:
    app.kubernetes.io/name: production-ingestor
    app.kubernetes.io/instance: production-ingestor
    app.kubernetes.io/component: api
# API only calls the Kubernetes API (RBAC below); it does not publish to SQS, so no IAM role annotation is needed here.
automountServiceAccountToken: true
imagePullSecrets:
  - name: orsted-artifactory-pull-secret
