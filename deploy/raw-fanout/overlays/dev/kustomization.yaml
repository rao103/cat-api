apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [../../base]
configMapGenerator:
  - name: raw-fanout-config
    literals:
      - RawFanOut__Region=eu-north-1
      - RawFanOut__RawQueueUrl=https://sqs.eu-north-1.amazonaws.com/REPLACE_ACCOUNT/cat-raw-dev
      - RawFanOut__RawDlqUrl=https://sqs.eu-north-1.amazonaws.com/REPLACE_ACCOUNT/cat-raw-dev-dlq
      - RawFanOut__HarmonizationQueueUrl=https://sqs.eu-north-1.amazonaws.com/REPLACE_ACCOUNT/cat-harmonize-dev
      - RawFanOut__RawContainerUri=https://REPLACE_ACCOUNT.blob.core.windows.net/REPLACE_CONTAINER
      - RawFanOut__ConsumerCount=1
      - RawFanOut__EnableDeadLetterConsumer=true
